# Current product identifiers. Stable values require a compatibility migration.
# The compatibility table is the exhaustive legacy-string allowlist for #140.

[product]
display_name = { current = "Quantum", stable = false }
tagline = { current = "An Aseprite-style 3D voxel editor for people and agents.", stable = false }

[identifiers]
# packaging/macos/Info.plist
bundle_id = { current = "co.worldwidewebb.quantum", stable = true }
bundle_name = { current = "Quantum", stable = false }
bundle_display_name = { current = "Quantum", stable = false }
bundle_executable = { current = "Quantum", stable = false }
# cargo xtask icons supplies the Quantize artwork.
bundle_icon = { current = "Quantum", stable = false }
# GPUI windows use quantum_app::APP_ID (crates/quantum-app/src/lib.rs), which
# must equal bundle_id; ui/{welcome,settings}.rs reference the constant.
window_app_id = { current = "co.worldwidewebb.quantum", stable = true }
# Current Info.plist declares no custom UTIs or document types. Do not invent IDs.
exported_utis = { current = [], stable = true }
imported_utis = { current = [], stable = true }
document_type_ids = { current = [], stable = true }

# Cargo manifests and xtask/src/macos/package.rs.
app_binary = { current = "quantum", stable = true }
mcp_binary = { current = "quantum-mcp", stable = true }
app_bundle = { current = "Quantum.app", stable = true }
release_asset = { current = "Quantum.dmg", stable = true }
crate_name_prefix = { current = "quantum-", stable = false }

# crates/quantum-mcp/src/{catalog,session,lib}.rs and quantum-site/src/install.rs
# Tool names currently use literals in catalog/dispatch, not a prefix constant.
mcp_tool_prefix = { current = "quantum_", stable = true }
mcp_api_version = { current = "quantum.v1", stable = true }
mcp_server_name = { current = "quantum", stable = true }
# Installed skill names and plugin namespaces can be referenced by workflows/data.
skills_name_prefix = { current = "quantum-", stable = true }
plugin_id_prefix = { current = "dev.quantum.", stable = true }

# The .voxl format is JSON, with a `format` discriminator rather than binary magic.
# Its schema has no $id; the versioned specification lives at the path below.
file_extension = { current = ".voxl", stable = true }
format_magic = { current = "quantum", stable = true }
format_spec = { current = "spec/voxl/1.0", stable = true }
format_mime_type = { current = "application/vnd.quantum.project+json", stable = true }
document_label = { current = "Quantum Project (.voxl)", stable = false }

# SUFeedURL is injected into the built Info.plist by cargo xtask macos package.
sparkle_appcast_url = { current = "https://quantum.worldwidewebb.co/appcast.xml", stable = true }
# Site origin is derived from this hostname by quantum-brand.
# Workspace Cargo.toml supplies the version; release links derive from repository and asset.
site_domain = { current = "quantum.worldwidewebb.co", stable = true }
github_repo_url = { current = "https://github.com/0x63616c/quantum", stable = true }

[storage]
# crates/quantum-app/src/{attachment,local_settings}.rs. macOS uses Application
# Support and migrates the entire legacy data directory on startup. Other
# platforms use XDG_DATA_HOME or the fallback; QUANTUM_DATA_DIR overrides both.
# settings.json, palettes.json, recents.json, thumbnails and session-<pid>.sock
# live under the data directory.
documents_directory = { current = "~/Documents/Quantum", stable = true }
data_directory_name = { current = "quantum", stable = true }
macos_data_directory = { current = "~/Library/Application Support/quantum", stable = true }
xdg_data_directory = { current = "$XDG_DATA_HOME/quantum", stable = true }
fallback_data_directory = { current = "~/.local/share/quantum", stable = true }
data_directory_env = { current = "QUANTUM_DATA_DIR", stable = true }

[artwork]
# Calum approved Quantize for #84: smooth left hemisphere, quantized right, hard seam.
# Edit the two SVG masters; cargo xtask icons regenerates all other artwork.
design = { current = "Quantize", stable = false }
icon_source = { current = "packaging/macos/icon.svg", stable = false }
small_mark_source = { current = "packaging/macos/mark-small.svg", stable = false }
mark = { current = "site/assets/mark.svg", stable = false }
favicon = { current = "site/assets/favicon.svg", stable = false }
readme_logo = { current = "site/assets/mark.svg", stable = false }
bundle_icon_asset = { current = "packaging/macos/Quantum.icns", stable = false }
app_icon = { current = "crates/quantum-app/assets/app-icon-256.png", stable = false }

# Legacy-name exceptions for `cargo xtask check brand`. Each group lists the exact
# case-sensitive literals it permits, the tracked files that may contain them, and why.
# A legacy occurrence is allowed only inside one of the group's literals in one of its
# files. Every listed file and literal must still match, so retired compatibility
# fails as stale; delete it from here when the compatibility code is removed.
[compatibility]
[compatibility.inventory]
current = ["voxelite", "Voxelite", "VOXELITE"]
stable = true
paths = [
  "brand.toml",
]
reason = "Exhaustive inventory of retained legacy compatibility literals."

[compatibility.bundle_migration]
current = ["co.worldwidewebb.voxelite"]
stable = true
paths = [
  "crates/quantum-app/src/local_settings/bundle_migration.rs",
]
reason = "Read the former preferences domain and migrate bundle-keyed stores once without replacing current data."

[compatibility.update_discovery]
current = ["Voxelite", "co.worldwidewebb.voxelite"]
stable = true
paths = [
  "xtask/src/macos/update_compat.rs",
]
reason = "Real identical signed payload under the legacy filename lets Sparkle find the new bundle ID; tests cover old and renamed installations."

[compatibility.format]
current = ["voxelite"]
stable = true
paths = [
  "crates/quantum-format/src/lib.rs",
  "spec/voxl/1.0/fixtures/legacy.input.voxl",
  "spec/voxl/1.0/schema.json",
]
reason = "Read-side v1 format discriminator alias and exactly one old project fixture; all writers emit quantum."

[compatibility.mcp]
current = ["voxelite.v1"]
stable = true
paths = [
  "spec/mcp/v1/compatibility.json",
  "crates/quantum-mcp/tests/tools_catalog.rs",
]
reason = "Document the equivalent legacy output-envelope version for clients reading old server responses; new servers emit quantum.v1."

[compatibility.storage]
current = ["VOXELITE_DATA_DIR", "voxelite"]
stable = true
paths = [
  "crates/quantum-app/src/local_settings.rs",
  "crates/quantum-app/src/local_settings/migration.rs",
  "crates/quantum-app/src/local_settings/migration/tests.rs",
]
reason = "One-time legacy directory migration and deprecated explicit environment override, including regression tests."

[compatibility.screenshot_baseline]
current = ["VOXELITE_DATA_DIR"]
stable = true
paths = [
  "scripts/capture-pr-screens.sh",
]
reason = "Isolate settings for pre-rename baseline binaries during before/after capture."

[compatibility.plugins]
current = ["dev.voxelite."]
stable = true
paths = [
  "crates/quantum-plugin-host/src/compatibility.rs",
  "crates/quantum-plugin-host/src/tests/compatibility.rs",
]
reason = "Read-side aliases for persisted enabled declarations and setting keys, with regression tests."

[compatibility.old_host]
current = ["voxelite.worldwidewebb.co"]
stable = true
paths = [
  "scripts/tests/test_brand_redirects.py",
  "site/vercel.json",
]
reason = "Keep the legacy updater endpoint directly serving the same signed feed while redirecting old pages."
generated_paths = ["vercel.json"]

[compatibility.release_urls]
current = ["0x63616c/voxelite/releases/download/"]
stable = true
paths = [
  "xtask/src/macos/mod.rs",
]
reason = "Validate immutable signed release URLs under the former repository slug after the GitHub redirect."

[compatibility.release_history]
current = ["Voxelite"]
stable = true
paths = [
  "xtask/src/macos/feed.rs",
  "xtask/src/macos/tests/appcast.rs",
]
reason = "Validate already published DMG/HTML filenames without rewriting signed release history."

[compatibility.explanation]
current = ["Voxelite", "voxelite", "VOXELITE_DATA_DIR"]
stable = true
paths = [
  "docs/rename-compatibility.md",
]
reason = "Explain the migration design and precise backward compatibility guarantees."

[compatibility.changelog]
current = ["Voxelite is now"]
stable = true
paths = [
  "CHANGELOG.md",
]
reason = "Historical rename announcement."
generated_paths = ["changelog/index.html", "changelog/index.md"]

[compatibility.rename_post]
current = ["Voxelite is now"]
stable = true
paths = [
  "site/content/blog/2026-10-28-rename.md",
]
reason = "Historical rename announcement title; current copy uses the canonical inventory."
generated_paths = ["blog/index.html", "blog/index.md", "blog/2026-10-28-rename/index.html", "blog/2026-10-28-rename/index.md"]

[compatibility.homebrew]
current = ["~/Library/Application Support/voxelite", "co.worldwidewebb.voxelite"]
stable = true
paths = ["packaging/homebrew/quantum.rb", "xtask/src/macos/tests/fixtures/homebrew.rb"]
reason = "Explicit zap removes legacy data, preferences and caches left by Voxelite-era builds (old bundle ID and data directory); projects remain untouched."
