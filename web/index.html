<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Voxelite — the voxel editor built for AI agents.">
  <title>Voxelite</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; color: #a3a3a3; font: 14px system-ui, sans-serif; text-align: center; }
    #loading strong { color: #fafafa; font-size: 20px; font-weight: 500; }
    #loading p { max-width: 480px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>Voxelite</strong><p>Opening Autumn Workshop…</p></div>
  <script type="module">
    import init from './voxelite_app.js';
    const status = document.querySelector('#loading');
    const observer = new MutationObserver(() => {
      if (document.querySelector('canvas')) { status.remove(); observer.disconnect(); }
    });
    observer.observe(document.body, {childList: true});
    try {
      const model = new URLSearchParams(location.search).get('model');
      if (model) {
        const url = new URL(model, location.href);
        if (url.origin !== location.origin || !/^\/gallery\/models\/[a-z0-9-]+\.voxl$/.test(url.pathname)) {
          throw new Error('Choose a model from the Voxelite gallery');
        }
        status.querySelector('p').textContent = 'Opening your gallery model…';
        const response = await fetch(url, { signal: AbortSignal.timeout(30000) });
        if (!response.ok) throw new Error('The gallery model could not be loaded');
        const limit = 16 * 1024 * 1024;
        const reader = response.body.getReader();
        const chunks = []; let size = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          size += value.byteLength;
          if (size > limit) { await reader.cancel(); throw new Error('Gallery model exceeds 16 MB'); }
          chunks.push(value);
        }
        const bytes = new Uint8Array(size); let offset = 0;
        for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.length; }
        window.voxeliteInitialModel = bytes;
      }
      await init();
      delete window.voxeliteInitialModel;
    }
    catch (error) {
      observer.disconnect();
      status.querySelector('p').textContent = `Unable to open the editor: ${error.message || error}. Please use a browser with WebGPU or WebGL2 enabled.`;
      console.error(error);
    }
  </script>
</body>
</html>
