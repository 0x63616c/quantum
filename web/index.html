  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:image:alt" content="Voxelite browser editor showing the Autumn Workshop model, editing tools, layers, and color palette.">
  <link rel="icon" href="https://voxelite.worldwidewebb.co/assets/mark.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; color: #a3a3a3; font: 14px system-ui, sans-serif; text-align: center; }
    #loading strong { color: #fafafa; font-size: 20px; font-weight: 500; }
    #loading p { max-width: 480px; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <div id="loading" role="status"><strong>Voxelite</strong><p>Opening Autumn Workshop…</p></div>
  <script type="module">
    import init from './voxelite_app.js';
    const status = document.querySelector('#loading');
    const observer = new MutationObserver(() => {
      if (document.querySelector('canvas')) { status.remove(); observer.disconnect(); }
    });
    observer.observe(document.body, {childList: true});
    try { await init(); }
    catch (error) {
      observer.disconnect();
      status.querySelector('p').textContent = `Unable to open the editor: ${error.message || error}. Please use a browser with WebGPU or WebGL2 enabled.`;
      console.error(error);
    }
  </script>
</body>
</html>
