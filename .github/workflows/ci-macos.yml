name: CI macOS

on:
  push:
    branches: [main]
  pull_request:
  # Always check nightly, even without new commits: runner and toolchain drift
  # can break packaging without a source change.
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.run_id || 'change' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    # Docs-only PRs skip the macOS build. A skipped job still satisfies required checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      package: ${{ steps.filter.outputs.package }}
      metal: ${{ steps.filter.outputs.metal }}
    steps:
      - name: Detect code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'metal=true' >> "$GITHUB_OUTPUT"
            echo 'code=true' >> "$GITHUB_OUTPUT"
            package=false
            if [[ "$GITHUB_REF" == refs/heads/main && ( "$GITHUB_EVENT_NAME" == schedule || "$GITHUB_EVENT_NAME" == workflow_dispatch ) ]]; then
              package=true
            fi
            echo "package=$package" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename, (.previous_filename // empty)')
          code=false
          package=false
          metal=false
          [[ -z "$files" ]] && code=true && package=true && metal=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            # PR smoke DMGs use ci-dist; PRs only run packaging when
            # packaging inputs change. Nightly and manual main runs also build it.
            case "$file" in
              packaging/*|xtask/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|crates/quantum-app/Cargo.toml|.github/workflows/ci-macos.yml|.github/workflows/release-macos.yml) package=true ;;
            esac
            case "$file" in
              docs/*|design/*|.agents/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
              # Crate READMEs, site content and skills are read by tests, so any nested path counts.
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
            # Inputs of the Metal profiling test (quantum-render and its path dependencies).
            case "$file" in
              crates/quantum-render/*|crates/quantum-render-plan/*|crates/quantum-format/*|crates/quantum-app/*|crates/quantum-core/*|crates/quantum-mesh/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|.config/nextest.toml|.github/workflows/ci-macos.yml) metal=true ;;
            esac
          done <<< "$files"
          echo "Code changes: $code, packaging changes: $package, Metal changes: $metal"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "metal=$metal" >> "$GITHUB_OUTPUT"

  scripts:
    # Packaging task tests mock the macOS tools, so a GitHub-hosted Linux runner
    # runs them in parallel with the macOS jobs.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check plugin dependency rule
        run: |
          cargo xtask check plugin-deps
      - name: Install nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150
      - name: Test packaging tasks
        run: cargo nextest run -p xtask --locked --profile ci
      - name: Test doctests (-p xtask)
        if: ${{ !cancelled() }}
        run: cargo test --doc -p xtask --locked

  macos:
    needs: changes
    # Stable required-check name, including fork PRs. Keep filtering at job level.
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      MACOS_SIGNING_MODE: adhoc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        # rustup reads the version and components from rust-toolchain.toml.
        run: rustup show
      - name: Check Xcode and Metal compiler
        run: |
          xcodebuild -version
          # GPUI compiles Metal shaders even though this job does not run GPU tests.
          if ! xcrun --sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun --sdk macosx metal --version
          fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-xcode-27.0
      - name: Select Rust packages
        id: rust-packages
        run: |
          # Add crates here when they gain macOS-specific code paths.
          echo 'packages=-p quantum-app -p quantum-ui -p quantum-render -p quantum-mcp -p quantum-bench' >> "$GITHUB_OUTPUT"
      - name: Clippy
        run: |
          cargo clippy ${{ steps.rust-packages.outputs.packages }} --all-targets --locked --features quantum-app/test-support -- -D warnings
          cargo clippy -p quantum-app -p quantum-render --all-targets --locked --features quantum-app/profiling -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150
      - name: Test Rust packages
        run: cargo nextest run ${{ steps.rust-packages.outputs.packages }} --locked --features quantum-app/test-support --profile ci
      - name: Test doctests
        if: ${{ !cancelled() }}
        run: cargo test --doc ${{ steps.rust-packages.outputs.packages }} --locked --features quantum-app/test-support
      - name: Build app and unsigned DMG
        if: needs.changes.outputs.package == 'true'
        env:
          PACKAGE_CARGO_PROFILE: ci-dist
        run: cargo xtask macos package
      - name: Upload unsigned DMG
        if: needs.changes.outputs.package == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Quantum-macos-arm64-unsigned
          path: |
            dist/Quantum.dmg
            dist/Quantum.dmg.sha256
          if-no-files-found: error
          retention-days: 3

  macos-hardware:
    needs: changes
    # PRs only run the GPU test for its inputs; every main push runs it.
    # Nightly/manual runs retain all workspace checks and release-profile packaging.
    # Only the owner may schedule work on the homelab runner; fork PRs never run here.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.metal == 'true') && github.actor == '0x63616c' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      DEVELOPER_DIR: /Applications/Xcode-27.0.app/Contents/Developer
      MACOS_SIGNING_MODE: adhoc
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up runner tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Use a warm per-runner Cargo target dir
        # actions/checkout runs `git clean -ffdx`, which deletes ./target and forces a cold
        # build every run. Keep the target dir next to the checkout instead: each runner has
        # its own _work dir, so concurrent runners never share it.
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$(dirname "$GITHUB_WORKSPACE")/cargo-target-ci-macos"
          max_kb=$((15 * 1024 * 1024))      # wipe above 15 GiB
          min_free_kb=$((15 * 1024 * 1024)) # or when the disk has under 15 GiB free
          if [[ -d "$target_dir" ]]; then
            used_kb=$(du -sk "$target_dir" | cut -f1)
            free_kb=$(df -k "$target_dir" | awk 'NR==2 {print $4}')
            echo "Warm target: $((used_kb / 1024)) MiB, disk free: $((free_kb / 1024)) MiB"
            if (( used_kb > max_kb || free_kb < min_free_kb )); then
              echo 'Clearing warm target dir to stay within the disk budget.'
              rm -rf "$target_dir"
            fi
          fi
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
      - name: Use the shared sccache server
        # One sccache server (launchd agent dev.quantum.sccache, port 4227) serves both
        # Mac mini runners, so a crate compiled by one runner is a cache hit on the other.
        # See docs/ci-runners.md. Without the server the build just runs uncached.
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null && nc -z -w 2 127.0.0.1 4227; then
            {
              echo "RUSTC_WRAPPER=$(command -v sccache)"
              echo 'SCCACHE_SERVER_PORT=4227'
              # sccache cannot cache incrementally compiled crates.
              echo 'CARGO_INCREMENTAL=0'
            } >> "$GITHUB_ENV"
            echo 'sccache enabled.'
          else
            echo '::notice::Shared sccache server is not running; building without it.'
          fi
      - name: Clippy workspace
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          cargo clippy --workspace --all-targets --locked --features quantum-app/test-support -- -D warnings
          cargo clippy -p quantum-app -p quantum-render --all-targets --locked --features quantum-app/profiling -- -D warnings
      - name: Install nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150

      - name: Test workspace
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo nextest run --workspace --locked --features quantum-app/test-support --profile ci

      - name: Test opt-in profiling on Metal
        run: cargo nextest run -p quantum-render --lib --locked --features profiling,gpu --profile ci --run-ignored only -E 'test(profiling_gpu_zones)'

      - name: Test doctests
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: cargo test --doc --workspace --locked --features quantum-app/test-support
      - name: Build app and unsigned DMG
        if: needs.changes.outputs.package == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          PACKAGE_CARGO_PROFILE: release
        run: cargo xtask macos package
      - name: sccache stats
        if: always() && env.RUSTC_WRAPPER != ''
        run: sccache --show-stats || true
      - name: Upload unsigned DMG
        if: needs.changes.outputs.package == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Quantum-macos-arm64-unsigned
          path: |
            dist/Quantum.dmg
            dist/Quantum.dmg.sha256
          if-no-files-found: error
          retention-days: 3

  report-nightly-failure:
    needs: [changes, scripts, macos-hardware]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (needs.changes.result != 'success' || needs.scripts.result != 'success' || needs.macos-hardware.result != 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          SCRIPTS_RESULT: ${{ needs.scripts.result }}
          MACOS_RESULT: ${{ needs.macos-hardware.result }}
        run: |
          set -euo pipefail
          title='ci: CI macOS nightly checks failed'
          body="Nightly checks did not complete successfully: $RUN_URL

          Changes: $CHANGES_RESULT; scripts: $SCRIPTS_RESULT; macOS: $MACOS_RESULT.
          Check the run logs and restore the full checks and release-profile DMG build."
          issue=$(gh issue list --state open --search "$title in:title" --limit 100 --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [[ -n "$issue" ]]; then
            gh issue edit "$issue" --add-label 'type:ci,area:ci,priority:p0'
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label 'type:ci,area:ci,priority:p0'
          fi
