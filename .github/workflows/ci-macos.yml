name: CI macOS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Docs-only PRs skip the macOS build. A skipped job still satisfies required checks.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      package: ${{ steps.filter.outputs.package }}
    steps:
      - name: Detect code changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'package=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename')
          code=false
          package=false
          [[ -z "$files" ]] && code=true && package=true
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            # The release-profile DMG build takes ~6 min, so PRs only run it when
            # packaging inputs change. Every push to main still builds it.
            case "$file" in
              packaging/*|xtask/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.cargo/*|crates/voxelite-app/Cargo.toml|.github/workflows/ci-macos.yml|.github/workflows/release-macos.yml) package=true ;;
            esac
            case "$file" in
              docs/*|design/*|.agents/*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md) ;;
              # Crate READMEs, site content and skills are read by tests, so any nested path counts.
              */*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<< "$files"
          echo "Code changes: $code, packaging changes: $package"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"

  scripts:
    # Packaging task tests mock the macOS tools, so a GitHub-hosted Linux runner
    # runs them in parallel and the Mac mini runners only do Rust builds.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check plugin dependency rule
        run: |
          cargo xtask check plugin-deps
      - name: Test packaging tasks
        run: cargo test -p xtask --locked

  macos:
    needs: changes
    # Never schedule untrusted fork code on the homelab runner.
    # Only the owner may schedule work on the homelab runner; fork PRs never run here.
    if: needs.changes.outputs.code == 'true' && github.actor == '0x63616c' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.0.app/Contents/Developer
      MACOS_SIGNING_MODE: adhoc
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up runner tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Use a warm per-runner Cargo target dir
        # actions/checkout runs `git clean -ffdx`, which deletes ./target and forces a cold
        # build every run. Keep the target dir next to the checkout instead: each runner has
        # its own _work dir, so concurrent runners never share it.
        shell: bash
        run: |
          set -euo pipefail
          target_dir="$(dirname "$GITHUB_WORKSPACE")/cargo-target-ci-macos"
          max_kb=$((15 * 1024 * 1024))      # wipe above 15 GiB
          min_free_kb=$((15 * 1024 * 1024)) # or when the disk has under 15 GiB free
          if [[ -d "$target_dir" ]]; then
            used_kb=$(du -sk "$target_dir" | cut -f1)
            free_kb=$(df -k "$target_dir" | awk 'NR==2 {print $4}')
            echo "Warm target: $((used_kb / 1024)) MiB, disk free: $((free_kb / 1024)) MiB"
            if (( used_kb > max_kb || free_kb < min_free_kb )); then
              echo 'Clearing warm target dir to stay within the disk budget.'
              rm -rf "$target_dir"
            fi
          fi
          mkdir -p "$target_dir"
          echo "CARGO_TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
      - name: Use the shared sccache server
        # One sccache server (launchd agent dev.voxelite.sccache, port 4227) serves both
        # Mac mini runners, so a crate compiled by one runner is a cache hit on the other.
        # See docs/ci-runners.md. Without the server the build just runs uncached.
        shell: bash
        run: |
          set -euo pipefail
          if command -v sccache >/dev/null && nc -z -w 2 127.0.0.1 4227; then
            {
              echo "RUSTC_WRAPPER=$(command -v sccache)"
              echo 'SCCACHE_SERVER_PORT=4227'
              # sccache cannot cache incrementally compiled crates.
              echo 'CARGO_INCREMENTAL=0'
            } >> "$GITHUB_ENV"
            echo 'sccache enabled.'
          else
            echo '::notice::Shared sccache server is not running; building without it.'
          fi
      # Formatting runs in CI Linux; the scripts job runs the portable task checks.
      - name: Clippy
        run: cargo clippy --workspace --locked --features voxelite-app/test-support -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked --features voxelite-app/test-support --no-fail-fast
      - name: Build app and unsigned DMG
        if: needs.changes.outputs.package == 'true'
        run: cargo xtask macos package
      - name: sccache stats
        if: always() && env.RUSTC_WRAPPER != ''
        run: sccache --show-stats || true
      - name: Upload unsigned DMG
        if: needs.changes.outputs.package == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Voxelite-macos-arm64-unsigned
          path: |
            dist/Voxelite.dmg
            dist/Voxelite.dmg.sha256
          if-no-files-found: error
          retention-days: 3
