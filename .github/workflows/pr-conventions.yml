name: PR conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            chore
            docs
            test
            ci
            perf
          requireScope: false
          subjectPattern: ^\S.*$

  linked-issue:
    name: Linked issue
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Require Closes/Fixes/Refs #N in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]*:?[[:space:]]+([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+'
          if printf '%s' "$PR_BODY" | grep -Eiq "$pattern"; then
            echo "Linked issue found."
          else
            echo "::error::PR body must link an issue with 'Closes #N', 'Fixes #N' or 'Refs #N'. See CONTRIBUTING.md."
            exit 1
          fi
