name: Release macOS
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. v0.1.0", required: true }
permissions:
  contents: write
concurrency: { group: release-macos, cancel-in-progress: false }
jobs:
  dmg:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode-27.0.app/Contents/Developer
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Set up runner tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Build and package
        env:
          MACOS_SIGNING_MODE: auto
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          VERSION="${TAG#v}" scripts/package-macos.sh
      - name: Generate signed update feed
        id: appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: scripts/generate-macos-appcast.sh
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Voxelite $TAG" --notes-file packaging/macos/RELEASE_NOTES.md --verify-tag
          gh release upload "$TAG" dist/Voxelite.dmg dist/Voxelite.dmg.sha256 --clobber
      - name: Upload update feed for the site deploy
        if: steps.appcast.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" site/appcast.xml --clobber
