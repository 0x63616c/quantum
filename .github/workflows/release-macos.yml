name: Release macOS
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. v0.2.0", required: true }
permissions: {}
concurrency: { group: release-macos, cancel-in-progress: false }
jobs:
  dmg:
    permissions:
      contents: write # publish the release and its assets
    # Only the owner may schedule work on the homelab runner; fork PRs never run here.
    if: github.actor == '0x63616c' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, xcode]
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 4
      DEVELOPER_DIR: /Applications/Xcode-27.0.app/Contents/Developer
      TAG: ${{ inputs.tag || github.ref_name }}
      # Public URL only; the app receives it only on its explicit build command.
      APP_REPORT_ENDPOINT: ${{ vars.QUANTUM_REPORT_ENDPOINT }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a stable version such as v0.2.0." >&2
            exit 1
          fi
      - name: Validate release credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          set +x
          for required in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID SPARKLE_ED_PRIVATE_KEY; do
            if [[ -z ${!required} ]]; then
              echo "Missing required release secret: $required" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A branch with the same name must never supply the release's code.
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up runner tools
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --locked --features quantum-app/test-support -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked --features quantum-app/test-support --no-fail-fast
      - name: Build app without signing credentials
        run: |
          cargo build --release --locked -p xtask
          target/release/xtask version --check-tag "$TAG"
          QUANTUM_REPORT_ENDPOINT="${APP_REPORT_ENDPOINT:-}" cargo build --release --locked -p quantum-app --bin quantum
          cargo build --release --locked -p quantum-mcp
      - name: Sign and package
        env:
          MACOS_SIGNING_MODE: auto
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set +x
          VERSION="${TAG#v}" target/release/xtask macos package --skip-build
      - name: Generate release notes
        run: |
          target/release/xtask macos release-notes
      - name: Download previous update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: target/release/xtask macos fetch-appcast dist/previous-appcast.xml
      - name: Generate signed update feed
        id: appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: target/release/xtask macos appcast
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          APPCAST_GENERATED: ${{ steps.appcast.outputs.generated }}
        run: |
          # Creation fails if this tag already has a release. Never replace bytes
          # referenced by an existing signed appcast, even when retrying a run.
          test "$APPCAST_GENERATED" = true
          gh release create "$TAG" --draft --title "Quantum $TAG" --notes-file dist/RELEASE_NOTES.md --verify-tag
          assets=(dist/Quantum.dmg dist/Quantum.dmg.sha256 dist/Quantum.html site/appcast.xml)
          gh release upload "$TAG" "${assets[@]}"
          gh release edit "$TAG" --draft=false

      - name: Remove build output from the self-hosted runner
        # The next checkout would `git clean` it anyway; deleting now keeps several GiB of
        # release-profile output from sitting on the Mac mini between runs.
        if: always()
        shell: bash
        run: rm -rf target dist

  homebrew-tap:
    needs: dmg
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions: { contents: read }
    if: github.actor == '0x63616c' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          if [[ -z "$HOMEBREW_TAP_DEPLOY_KEY" ]]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is missing; skipping tap update"
            exit 0
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid stable release tag" >&2
            exit 1
          fi
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          umask 077
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > "$work/deploy-key"
          chmod 600 "$work/deploy-key"
          unset HOMEBREW_TAP_DEPLOY_KEY
          gh release download "$TAG" --repo 0x63616c/quantum --pattern Quantum.dmg --pattern Quantum.dmg.sha256 --dir "$work"
          expected=$(awk 'NR == 1 {print $1}' "$work/Quantum.dmg.sha256")
          actual=$(sha256sum "$work/Quantum.dmg" | cut -d ' ' -f 1)
          if [[ ! "$expected" =~ ^[a-fA-F0-9]{64}$ || "${expected,,}" != "$actual" ]]; then
            echo "Published DMG checksum mismatch" >&2
            exit 1
          fi
          unset GH_TOKEN
          cargo xtask macos homebrew-cask --version "${TAG#v}" --sha256 "$actual" --output "$work/quantum.rb"
          cp packaging/homebrew/github_known_hosts "$work/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $work/deploy-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$work/known_hosts"
          git clone --branch main --single-branch git@github.com:0x63616c/homebrew-tap.git "$work/tap"
          cp "$work/quantum.rb" "$work/tap/Casks/quantum.rb"
          git -C "$work/tap" add Casks/quantum.rb
          if git -C "$work/tap" diff --cached --quiet; then
            exit 0
          fi
          git -C "$work/tap" config user.name Calum
          git -C "$work/tap" config user.email 6991398+0x63616c@users.noreply.github.com
          git -C "$work/tap" commit -m "quantum ${TAG#v}"
          git -C "$work/tap" push origin HEAD:main
