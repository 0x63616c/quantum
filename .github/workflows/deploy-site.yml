name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Release events emitted with GITHUB_TOKEN do not start another workflow.
  # workflow_run does, and checks out the trusted default branch, not tag code.
  workflow_run:
    workflows: ["Release macOS"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == '0x63616c' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential rsync

      - name: Install pinned Rust toolchain
        run: |
          # rustup reads the version and components from rust-toolchain.toml.
          rustup show

      - name: Download signed release appcast or empty initial feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask macos fetch-appcast site/appcast.xml

      - name: Build site
        run: scripts/build-site.sh

      - name: Verify site
        run: |
          python3 scripts/check-site.py
          cargo xtask macos check-appcast site/appcast.xml --allow-empty
          test -s site/index.html
          test -s site/llms.txt

      - name: Stage public files
        run: |
          # Keep public Markdown exports and downloadable skill/integration docs.
          mkdir -p "$RUNNER_TEMP/site-dist"
          rsync -a --exclude=/README.md --exclude=/content/ \
            site/ "$RUNNER_TEMP/site-dist/"

      - name: Upload built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: ${{ runner.temp }}/site-dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == '0x63616c/voxelite' && github.actor == '0x63616c'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-dist
          path: site-dist

      - name: Publish site-dist branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site-publish"
          cd "$RUNNER_TEMP/site-publish"
          git init --initial-branch=site-dist
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          # Read the job token via gh, keeping it out of remote URLs and logs.
          git config credential.helper '!gh auth git-credential'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

          # Preserve deploy history if present; otherwise start a new root commit.
          existing_branch=$(git ls-remote --heads origin refs/heads/site-dist)
          if [[ -n "$existing_branch" ]]; then
            git fetch --depth=1 origin refs/heads/site-dist
            git checkout -B site-dist FETCH_HEAD
          fi
          rsync -a --delete --exclude=/.git/ "$GITHUB_WORKSPACE/site-dist/" ./
          git add --all
          if git diff --cached --quiet; then
            echo 'Published site is unchanged.'
            exit 0
          fi
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push origin HEAD:site-dist

      - name: Deploy site to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Identifiers, not credentials: team "Calums Projects" and project "voxelite".
          VERCEL_ORG_ID: team_9RGvkGZTIxuS3X5hhsvfHK6N
          VERCEL_PROJECT_ID: prj_m4pSJixQnOROg4B2Ak54pABlCQyR
        run: |
          set -euo pipefail
          # The Vercel project has no Git integration, so pushing site-dist never
          # deploys by itself. Deploy the exact built bytes (signed appcast included).
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo '::warning::VERCEL_TOKEN is not set; site-dist was pushed but nothing was deployed to Vercel.'
            exit 0
          fi
          cd site-dist
          npx --yes vercel@65.4.0 deploy --prod --yes --token "$VERCEL_TOKEN"
