name: CI Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev rsync

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: |
          cargo xtask lint
          cargo clippy --workspace --all-targets --locked --features voxelite-app/test-support -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150

      - name: Test workspace
        run: cargo nextest run --workspace --locked --features voxelite-app/test-support --profile ci

      - name: Test doctests (--workspace)
        if: ${{ !cancelled() }}
        run: cargo test --doc --workspace --locked --features voxelite-app/test-support

      - name: Check repository hygiene
        run: cargo xtask check tidy

      - name: Check repository consistency
        run: cargo xtask check workflows plugin-deps brand docs-links docs-assets

      - name: Install dependency checks
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2

      - name: Check dependency policy
        run: cargo deny check

      - name: Check unused dependencies
        run: cargo machete
