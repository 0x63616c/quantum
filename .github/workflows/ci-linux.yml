name: CI Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake pkg-config libssl-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev rsync \
            mesa-vulkan-drivers

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        env:
          LINT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: |
          cargo xtask lint
          cargo clippy --workspace --all-targets --locked --features quantum-app/test-support -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.150

      - name: Test workspace
        run: cargo nextest run --workspace --locked --features quantum-app/test-support --profile ci

      - name: Test release window startup
        env:
          CARGO_BUILD_JOBS: 4
        run: cargo nextest run --release -p quantum-app --bin quantum --locked --features test-support --profile ci -E 'test(first_frame)'

      - name: Check opt-in profiling
        env:
          XDG_RUNTIME_DIR: /tmp
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          cargo clippy -p quantum-app -p quantum-render --all-targets --locked --features quantum-app/profiling,quantum-render/headless-vulkan -- -D warnings
          cargo nextest run -p quantum-render --locked --features profiling,headless-vulkan --profile ci
          cargo nextest run -p quantum-render --lib --locked --features profiling,headless-vulkan --profile ci --run-ignored only -E 'test(profiling_gpu_zones)'

      - name: Test doctests (--workspace)
        if: ${{ !cancelled() }}
        run: cargo test --doc --workspace --locked --features quantum-app/test-support

      - name: Check repository hygiene
        run: cargo xtask check tidy

      - name: Install spelling checker
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: typos-cli@1.51.1

      - name: Check repository consistency
        run: cargo xtask check workflows plugin-deps brand typos docs-links docs-assets

      - name: Install dependency checks
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2

      - name: Check dependency policy
        run: cargo deny check

      - name: Check unused dependencies
        run: cargo machete
