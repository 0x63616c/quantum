name: Bug
description: "Something behaves incorrectly."
title: "fix: "
labels: ["type:fix"]
body:
  - type: textarea
    id: why
    attributes:
      label: "Why"
      description: "Impact: who is affected and how badly."
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: "Model"
      description: "Maps to the model:astra / model:sol label. Maintainers apply the label."
      options:
        - "sol (everyday: fixes, CI, docs, simple refactors)"
        - "astra (hard: UI/design, complex refactors, spikes, ports)"
      default: 0
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Steps to reproduce"
      description: "Steps, expected vs actual behavior, version and platform."
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: "Done when"
      description: "Observable outcomes. Each one is checked against the merged PR before closing."
      value: |
        - [ ] 
        - [ ] Tests or evidence linked in the PR
    validations:
      required: true
