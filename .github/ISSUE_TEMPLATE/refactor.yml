name: Refactor
description: "Restructure code without changing behavior."
title: "refactor: "
labels: ["type:refactor"]
body:
  - type: textarea
    id: why
    attributes:
      label: "Why"
      description: "What is hard or risky today (size, duplication, drift)."
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: "Approach"
      description: "Target structure, files touched and how behavior is shown to be unchanged."
    validations:
      required: false
  - type: textarea
    id: done
    attributes:
      label: "Done when"
      description: "Observable outcomes. Each one is checked against the merged PR before closing."
      value: |
        - [ ] 
        - [ ] Tests or evidence linked in the PR
    validations:
      required: true
