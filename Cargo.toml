[workspace]
members = ["crates/*", "crates/plugins/*", "xtask"]
# Exclude only the container manifest; excluding the directory also excludes plugins.
exclude = ["crates/plugins/Cargo.toml"]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
slotmap = "1.1.1"
voxelite-core = { path = "crates/voxelite-core" }
voxelite-format = { path = "crates/voxelite-format" }
voxelite-mesh = { path = "crates/voxelite-mesh" }
voxelite-plugin-api = { path = "crates/voxelite-plugin-api" }
voxelite-plugin-host = { path = "crates/voxelite-plugin-host" }
voxelite-render = { path = "crates/voxelite-render" }
voxelite-render-plan = { path = "crates/voxelite-render-plan" }
voxelite-mcp = { path = "crates/voxelite-mcp", default-features = false }
voxelite-plugins-builtin = { path = "crates/voxelite-plugins-builtin" }
voxelite-ui = { path = "crates/voxelite-ui" }
voxelite-plugin-agent = { path = "crates/plugins/voxelite-plugin-agent" }
voxelite-plugin-comments = { path = "crates/plugins/voxelite-plugin-comments" }
voxelite-plugin-exporters = { path = "crates/plugins/voxelite-plugin-exporters" }
voxelite-plugin-gizmo-grid = { path = "crates/plugins/voxelite-plugin-gizmo-grid" }
voxelite-plugin-mirror = { path = "crates/plugins/voxelite-plugin-mirror" }
voxelite-plugin-palette = { path = "crates/plugins/voxelite-plugin-palette" }
voxelite-plugin-shadows-lighting = { path = "crates/plugins/voxelite-plugin-shadows-lighting" }
voxelite-plugin-tools = { path = "crates/plugins/voxelite-plugin-tools" }
voxelite-crash = { path = "crates/voxelite-crash" }
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["raw_value"] }
semver = "1.0"
serde-saphyr = "2.0.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
sha2 = "0.10"
proptest = "1.9"
divan = "0.1.21"
png = "0.18"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
url = "2"
glob = "0.3"
plist = "1.8"
regex = "1"
roxmltree = "0.21"
rustix = { version = "1.1", features = ["process"] }
signal-hook = "0.3"
xshell = "0.2.7"
toml = "1.1"
glam = "0.30"
base64 = "0.22"
futures-channel = "0.3"
gpui = { package = "gpui-unofficial", version = "=1.25.3", default-features = false }
objc2 = "0.6.5"
tempfile = "3"
insta = { version = "1.49", default-features = false, features = ["json"] }
schemars = "1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep CPU viewport interaction responsive in the native development build.
[profile.dev.package.voxelite-render]
opt-level = 3

[profile.dev.package.voxelite-mesh]
opt-level = 3

[profile.dev.package.voxelite-core]
opt-level = 2

# Pinned GPUI surface handoff fixes; see vendor/README.md.
[patch.crates-io]
gpui-apple-gpui-unofficial = { path = "vendor/gpui-apple" }
