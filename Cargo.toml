[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
voxelite-core = { path = "crates/voxelite-core" }
voxelite-format = { path = "crates/voxelite-format" }
voxelite-plugin = { path = "crates/voxelite-plugin" }
voxelite-render = { path = "crates/voxelite-render" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }
sha2 = "0.10"
proptest = "1.9"
png = "0.18"
glam = "0.30"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep CPU viewport interaction responsive in the native development build.
[profile.dev.package.voxelite-render]
opt-level = 3

[profile.dev.package.voxelite-core]
opt-level = 2

# Fast browser iteration with optimized rasterization and a compact wasm module.
[profile.web]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = "debuginfo"

# Pinned GPUI surface handoff fixes; see vendor/README.md.
[patch.crates-io]
gpui-apple-gpui-unofficial = { path = "vendor/gpui-apple" }
