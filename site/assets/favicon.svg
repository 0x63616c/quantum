<svg xmlns="http://www.w3.org/2000/svg" viewBox="224 224 576 576">
  <title>Quantum — Quantize small mark</title>
  <!-- Optical master for 16/32 px: four rows, 106 px cells, 32 px gaps. -->
    <defs>
      <radialGradient id="sphere" cx="539.6" cy="340.88" r="447.12" gradientUnits="userSpaceOnUse">
        <stop stop-color="#fff"/>
        <stop offset=".3" stop-color="#d4d4d4"/>
        <stop offset=".62" stop-color="#6b6b6b"/>
        <stop offset=".86" stop-color="#2e2e2e"/>
        <stop offset="1" stop-color="#262626"/>
      </radialGradient>
      <linearGradient id="sphere-rim" x2="1" y2="1">
        <stop stop-color="#fff" stop-opacity="0"/>
        <stop offset=".6" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
      </linearGradient>
      <clipPath id="left"><path d="M 0 0 H 509 V 1024 H 0 Z"/></clipPath>
    </defs>
    <!-- The clip ends at x=509. No blur or feather on the hemisphere or seam. -->
    <g clip-path="url(#left)">
      <circle cx="512" cy="512" r="276" fill="url(#sphere)"/>
      <circle cx="512" cy="512" r="274.5" fill="none" stroke="url(#sphere-rim)" stroke-width="3"/>
    </g>
  <g>
      <rect x="528" y="252" width="106" height="106" rx="12" fill="#fafafa"/>
      <rect x="528" y="390" width="106" height="106" rx="12" fill="#cecece"/>
      <rect x="666" y="390" width="106" height="106" rx="12" fill="#989898"/>
      <rect x="528" y="528" width="106" height="106" rx="12" fill="#646464"/>
      <rect x="666" y="528" width="106" height="106" rx="12" fill="#646464"/>
      <rect x="528" y="666" width="106" height="106" rx="12" fill="#282828"/>
  </g>
</svg>
