[advisories]
# Use the default RustSec advisory database.
ignore = [
    # Unmaintained transitive crates with no patched releases. Remove these
    # exceptions when the pinned GPUI stack migrates to maintained replacements.
    { id = "RUSTSEC-2024-0436", reason = "paste is required by GPUI's metal and image/pulp dependencies; replacement requires upstream changes." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is required by GPUI and its fontdb/usvg dependencies; replacement requires upstream changes." },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is required by GPUI's usvg dependency; replacement requires an upstream usvg upgrade." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is required by GPUI's Linux D-Bus dependencies; migration requires upstream adoption of zbus 6." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is required by GPUI's Linux D-Bus dependencies; migration requires upstream adoption of zbus 6." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is required by GPUI's Linux D-Bus dependencies; migration requires upstream adoption of zbus 6." },
]

[licenses]
# Workspace crates are MIT. These satisfy the resolved dependency graph,
# including the vendored Apache-2.0 GPUI patch and platform-specific crates.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# GPUI's patch is vendored locally; Cargo.lock has no git sources.
allow-git = []
