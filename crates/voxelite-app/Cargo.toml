[package]
name = "voxelite-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native"]
native = ["dep:gpui", "dep:gpui_platform", "dep:image", "dep:env_logger"]

[[bin]]
name = "voxelite"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
voxelite-mcp = { path = "../voxelite-mcp" }
voxelite-core.workspace = true
voxelite-format.workspace = true
voxelite-render.workspace = true
voxelite-export = { path = "../voxelite-export" }
glam.workspace = true
thiserror.workspace = true
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
anyhow = "1"
tempfile = "3"
gpui = { package = "gpui-unofficial", version = "=1.25.3", default-features = false, optional = true }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.25.3", default-features = false, features = ["x11", "wayland", "font-kit"], optional = true }
image = { version = "0.25", default-features = false, optional = true }

[lints]
workspace = true

[dependencies.env_logger]
version = "0.11"
optional = true
