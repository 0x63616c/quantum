[package]
name = "quantum-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent-first Quantum MCP server over stdio"

[features]
default = ["standalone"]
standalone = ["dep:quantum-plugins-builtin"]

[[bin]]
name = "quantum-mcp"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
quantum-core.workspace = true
quantum-plugin-api.workspace = true
quantum-plugin-host.workspace = true
# Used only by the binary composition root; the library receives a host factory.
quantum-plugins-builtin = { workspace = true, optional = true }
quantum-format.workspace = true
quantum-render.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util"] }
base64.workspace = true
jsonschema = { version = "0.37", default-features = false }

[target.'cfg(unix)'.dependencies]
# Safe effective-UID lookup for the socket directory check; already in the graph.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
insta.workspace = true
quantum-plugin-shadows-lighting.workspace = true
quantum-plugins-builtin.workspace = true
quantum-plugin-comments.workspace = true
# Match the site's catalog key order in standalone and workspace test runs.
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true

[lints]
workspace = true
