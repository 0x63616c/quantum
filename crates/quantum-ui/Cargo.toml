[package]
name = "quantum-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true

unicode-segmentation = "=1.13.3"

[lints]
workspace = true

# Only the executable gallery needs a native GPUI platform. Library dependencies stay portable.
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.25.3", default-features = false, features = ["x11", "wayland", "font-kit"] }
