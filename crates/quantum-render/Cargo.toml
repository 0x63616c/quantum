[package]
name = "quantum-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tracing = { workspace = true, optional = true }
quantum-core.workspace = true
quantum-mesh.workspace = true
serde.workspace = true
rayon = "1.12"
quantum-render-plan.workspace = true

# Unsafe FFI is confined to the audited Metal interop module.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"

[dependencies.glam]
workspace = true

[dev-dependencies]
divan.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
quantum-format.workspace = true
proptest.workspace = true
serde_json.workspace = true

[features]
# Live tracing is explicitly opt-in, including in release builds.
profiling = ["dep:tracing", "quantum-mesh/profiling"]
# Additive backend for the portable harness; production Metal devices are unchanged.
headless-vulkan = ["gpu", "wgpu/vulkan"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:objc2-core-foundation", "dep:objc2-core-video", "dep:objc2-metal", "dep:futures-timer", "dep:objc2-io-surface", "dep:objc2", "dep:pollster", "dep:futures-channel"]

[dependencies.wgpu]
version = "=30.0.1"
default-features = false
features = ["std", "parking_lot", "wgsl", "metal"]
optional = true

[dependencies.bytemuck]
version = "1"
features = ["derive"]
optional = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }
futures-channel = { workspace = true, optional = true }
objc2-core-foundation = { version = "0.3.2", optional = true }
objc2-core-video = { version = "0.3.2", optional = true, features = ["objc2-metal", "objc2-io-surface"] }
objc2-metal = { version = "0.3.2", optional = true }
futures-timer = { version = "3", optional = true }
objc2-io-surface = { version = "0.3.2", optional = true, features = ["objc2-core-foundation"] }

[dev-dependencies.naga]
version = "=30.0.1"
features = ["wgsl-in"]

[[bench]]
name = "chunks"
harness = false
