[package]
name = "voxelite-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Benchmark-only admission of render-only scenes above the production voxel limit.
large-scenes = ["voxelite-core/unbounded-voxels"]

[dependencies]
voxelite-core.workspace = true
voxelite-format.workspace = true
voxelite-render = { workspace = true, features = ["gpu"] }
serde.workspace = true
serde_json.workspace = true
png.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
voxelite-render = { workspace = true, features = ["headless-vulkan"] }

[lints]
workspace = true
