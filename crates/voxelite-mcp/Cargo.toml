[package]
name = "voxelite-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent-first Voxelite MCP server over stdio"

[features]
default = ["standalone"]
standalone = ["dep:voxelite-plugins-builtin"]

[[bin]]
name = "voxelite-mcp"
path = "src/main.rs"
required-features = ["standalone"]

[dependencies]
voxelite-core.workspace = true
voxelite-plugin-api.workspace = true
voxelite-plugin-host.workspace = true
# Used only by the binary composition root; the library receives a host factory.
voxelite-plugins-builtin = { path = "../voxelite-plugins-builtin", optional = true }
voxelite-format.workspace = true
voxelite-render.workspace = true
png.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util"] }
base64 = "0.22"
jsonschema = { version = "0.37", default-features = false }

[target.'cfg(unix)'.dependencies]
# Safe effective-UID lookup for the socket directory check; already in the graph.
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
voxelite-plugins-builtin = { path = "../voxelite-plugins-builtin" }
voxelite-plugin-comments = { path = "../plugins/voxelite-plugin-comments" }
# Match the site's catalog key order in standalone and workspace test runs.
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = "3"

[lints]
workspace = true
