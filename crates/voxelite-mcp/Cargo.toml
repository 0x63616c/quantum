[package]
name = "voxelite-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agent-first Voxelite MCP server over stdio"

[dependencies]
voxelite-core.workspace = true
voxelite-plugin-api.workspace = true
voxelite-plugin-host.workspace = true
voxelite-plugin-exporters = { path = "../plugins/voxelite-plugin-exporters" }
voxelite-plugin-palette = { path = "../plugins/voxelite-plugin-palette" }
voxelite-format.workspace = true
voxelite-render.workspace = true
voxelite-export = { path = "../voxelite-export" }
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util"] }
base64 = "0.22"
jsonschema = { version = "0.37", default-features = false }

[dev-dependencies]
tempfile = "3"
png.workspace = true

[lints]
workspace = true
