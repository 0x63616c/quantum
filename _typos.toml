[files]
# Git metadata is generated binary data, never source or documentation.
# Third-party sources and license texts must retain upstream bytes.
# Vendored third-party impeccable files retain upstream spelling.
extend-exclude = [
    ".git/**",
    "vendor/**",
    "crates/quantum-app/assets/licenses/**",
    ".agents/skills/impeccable/**",
    ".claude/skills/impeccable/**",
    ".claude/agents/impeccable-*",
    ".cursor/skills/impeccable/**",
    ".cursor/agents/impeccable-*",
]

[default.extend-words]
# Native project extension.
voxl = "voxl"
# typos splits the plural PNGs into PN + Gs.
PN = "PN"
# Integer y coordinate paired with ix in raster sampling.
iy = "iy"
# Shader level-of-detail abbreviation.
LOD = "LOD"
